name: QA Job Alert

on:
  schedule:
    - cron: '30 3 * * 1-6'   # 9:00 AM IST  Mon–Sat (daily check)
    - cron: '30 11 * * 1-6'  # 5:00 PM IST  Mon–Sat (daily check)
    - cron: '30 3 * * 0'     # 9:00 AM IST  Sunday  (weekly summary)
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: daily or weekly'
        required: false
        default: 'daily'

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4

      - name: Run daily check (9AM IST)
        if: github.event.schedule == '30 3 * * 1-6'
        run: python check_jobs.py
        env:
          RUN_MODE: daily
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Run daily check (5PM IST)
        if: github.event.schedule == '30 11 * * 1-6'
        run: python check_jobs.py
        env:
          RUN_MODE: daily
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Run weekly summary (Sunday)
        if: github.event.schedule == '30 3 * * 0'
        run: python check_jobs.py
        env:
          RUN_MODE: weekly
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Run manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: python check_jobs.py
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      # Commit updated stats.json back to the repo
      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "chore: update weekly stats [skip ci]"
          git push
